<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPUS 38 - Extraits</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fa;
    padding:20px;
}
.player{
    max-width:760px;
    margin:auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}
.header{
    background:linear-gradient(135deg,#1d3557,#457b9d);
    color:white;
    padding:28px;
    text-align:center;
}
.header h1{
    margin:0;
    font-size:32px;
}
.header p{
    margin:8px 0 0;
    opacity:.9;
}
.track{
    padding:20px 24px;
    border-bottom:1px solid #e9eef3;
}
.track:last-child{
    border-bottom:none;
}
.title{
    font-size:20px;
    font-weight:700;
    color:#1d3557;
}
.composer{
    color:#667085;
    margin:4px 0 12px;
}
audio{
    width:100%;
    height:42px;
}
.note{
    padding:18px 24px;
    font-size:13px;
    color:#667085;
    background:#fafbfc;
}
</style>
</head>

<body>

<div class="player">

<div class="header">
    <p>Extraits audio </p>
</div>

<div class="track">
    <div class="title">Lux Aeterna</div>
    <div class="composer">Edward Elgar</div>
    <audio controls preload="none">
        <source src="audio/5 lux Aeterna - Elgar.mp3" type="audio/mpeg">
    </audio>
</div>

<div class="track">
    <div class="title">Stemning</div>
    <div class="composer">Wilhelm Peterson-Berger</div>
    <audio controls preload="none">
        <source src="audio/4 stemning - Peterson.mp3" type="audio/mpeg">
    </audio>
</div>

</div>

</body>
</html>
