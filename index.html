<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPUS 38 - Extraits</title>

<style>
*{box-sizing:border-box}
body{
    margin = 0;
    font-family: Lora Moyen;
    background:#cec3ba;
    padding:0;
}
.player{
    max-width:760px;
    margin:auto;
    background:transparent;
    box-shadow:none;
    border-radius:0;
}
.header{
    background:linear-gradient(135deg,#1d3557,#457b9d);
    color:white;
    padding:28px;
    text-align:center;
}
.header h1{
    margin:0;
    font-size:32px;
}
.header p{
    margin:8px 0 0;
    opacity:.9;
}
.track{
    background:transparent;
    margin:12px 0;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.track:last-child{
    border-bottom:none;
}
.title{
    font-size:20px;
    font-weight:700;
    color:#493b31;
}
.composer{
    color:#493b31;
    margin:4px 0 12px;
}
audio{
    width:100%;
    height:42px;
}
.note{
    padding:18px 24px;
    font-size:13px;
    color:#667085;
    background:#fafbfc;
}
</style>
</head>

<body>

<div class="player">

<div class="header">
    <h1>Extraits audio </h1>
</div>

<div class="track">
    <div class="title">Lux Aeterna</div>
    <div class="composer">Edward Elgar</div>
    <audio controls preload="none">
        <source src="audio/5 lux Aeterna - Elgar.mp3" type="audio/mpeg">
    </audio>
</div>

<div class="track">
    <div class="title">Stemning</div>
    <div class="composer">Wilhelm Peterson-Berger</div>
    <audio controls preload="none">
        <source src="audio/4 stemning - Peterson.mp3" type="audio/mpeg">
    </audio>
</div>

<div class="track">
    <div class="title">My Lord Has Come</div>
    <div class="composer">Will Todd</div>
    <audio controls preload="none">
        <source src="audio/7 my lord - Todd.mp3" type="audio/mpeg">
    </audio>
</div>
    
</div>

</body>
</html>
